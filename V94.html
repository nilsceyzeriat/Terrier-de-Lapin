<HTML> 
    
    <HEAD>

<style>

.ut-dialogue 
{
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: min(92vw, 640px);
    min-height: 140px;
    box-sizing: border-box;
    padding: 20px 28px;
    background: #000;
    border: 6px solid #fff;
    color: #fff;
    font-family: "VT323", "Courier New", monospace;
    font-size: clamp(22px, 4.2vw, 30px);
    line-height: 1.25;
    letter-spacing: 0.04em;
    cursor: pointer;
    z-index: 1000;
    image-rendering: pixelated;
     text-align : left ;
}

.ut-dialogue__text::before 
{
    content: "* ";
}

.ut-dialogue__text 
{
    margin: 0;
    white-space: pre-wrap;
}

.ut-dialogue__next 
{
    position: absolute;
    right: 16px;
    bottom: 10px;
    font-size: 20px;
    visibility: hidden;
    animation: ut-blink 0.8s steps(1) infinite;
}

.ut-dialogue.is-done .ut-dialogue__next 
{
    visibility: visible;
}
  
@keyframes ut-blink
{
    50% { opacity: 0; }
}

body 
{
    text-align : center ; margin: 0; min-height: 100vh; 
}

.sortie1
{
    width : 200px ; margin-right : 15vw ; margin-top : 10vw ;
}

.sortie2
{
    width : 200px ; margin-left : 15vw ; margin-top : 10vw ;
}

</style>

		<META charset= "utf-8"  / >

		<TITLE>Jeu Backroom</TITLE>

		<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

		<link rel="icon" type="image/jpg" href="image/Coeur 2.png">

	</HEAD>

		<div class="ut-dialogue" id="ut-dialogue" role="status" aria-live="polite" tabindex="0">
  		<p class="ut-dialogue__text" id="ut-text"></p>
  		<span class="ut-dialogue__next" aria-hidden="true">▼</span>
		</div>

    <BODY>

<div id="fond"
     style="position: fixed;
            top: -2vw;
            left: -2vw;
            width: 104vw;
            height: calc(100vh + 4vw);
            background: url('image2/Bravo.jpg') center / cover no-repeat;
            z-index: -1;
            pointer-events: none;
            transition: transform 0.2s ease-out;">
</div>

		<a href="Intro.html">
  		<img class = "sortie1" src="image2/Manette.jpg" alt="DEF"
      style="transition: transform 0.3s ease;"
      onmouseover="this.style.transform='scale(1.3)'"
      onmouseout="this.style.transform='scale(1)'">
		<a/>	

		<a href="index.html">
  		<img class = "sortie2" src="image/Lapin blanc.jpg" alt="DEF"
      style="transition: transform 0.3s ease;"
      onmouseover="this.style.transform='scale(1.3)'"
      onmouseout="this.style.transform='scale(1)'">
		<a/>	

<script>

 const REPLIQUES = [
    "Vous vous enfoncez pas à pas dans ce couloir souterrain.",
    "Plus vous avancez et plus le trou devient large, un lapin apparaît d’une galerie connectée au tunnel.",
    "Il vous annonce qu’il connaît la sortie et qu’il peut vous ramener au site sur les lapins sain et sauf.",
    "Bravo ! Vous avez trouvé une des bonnes fins.",
    "Cliquer sur la manette pour retourner au début afin de chercher les autres fins ou sur le lapin pour retourner au site.",
  ];

  const VITESSE = 35;

  const boite = document.getElementById("ut-dialogue");
  const texte = document.getElementById("ut-text");
  const reduireMouvement = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let index = 0;
  let timer = null;

  function afficher(i) {
    clearInterval(timer);
    boite.classList.remove("is-done");
    const ligne = REPLIQUES[i];
    if (reduireMouvement) {
      texte.textContent = ligne;
      boite.classList.add("is-done");
      return;
    }
    let n = 0;
    texte.textContent = "";
    timer = setInterval(() => {
      n++;
      texte.textContent = ligne.slice(0, n);
      if (n >= ligne.length) {
        clearInterval(timer);
        boite.classList.add("is-done");
      }
    }, VITESSE);
  }

  function suivant() {
    if (!boite.classList.contains("is-done")) {
      clearInterval(timer);
      texte.textContent = REPLIQUES[index];
      boite.classList.add("is-done");
    } else if (index < REPLIQUES.length - 1) {
      index++;
      afficher(index);
    }
  }

  boite.addEventListener("click", suivant);
  boite.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      suivant();
    }
  });

  afficher(0);
  
document.addEventListener("mousemove", function (e) {
    var x = (e.clientX / window.innerWidth - 0.5) * -2;
    var y = (e.clientY / window.innerHeight - 0.5) * -2;
    var force = 1.5;
    document.getElementById("fond").style.transform =
        "translate(" + x * force + "vw, " + y * force + "vw)";
});

</script>

		</BODY>

</HTML>
